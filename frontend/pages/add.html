<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="./css/add.css" />
</head>
<body>
  <h2>Agregar Producto</h2>

  <form id="productForm" enctype="multipart/form-data">
    <label>Nombre:
      <input type="text" name="name" required />
    </label>
    <label>Precio:
      <input type="number" name="price" step="0.01" required />
    </label>
    <label>Categoría:
      <select name="category_id" id="category" required>
        <option value="" disabled selected>Selecciona una categoría</option>
        <option value="1">1 - Ropa de Mujer</option>
        <option value="2">2 - Ropa de Hombre</option>
        <option value="3">3 - Calzado</option>
        <option value="4">4 - Accesorios</option>
      </select>
    </label>
    <label>Subcategoría:
      <select name="subcategory_id" id="subcategory" required disabled>
        <option value="" disabled selected>Selecciona una subcategoría</option>
        <option value="1" data-category="1">1 - Blouses & Shirts</option>
        <option value="2" data-category="1">2 - Dresses</option>
        <option value="3" data-category="1">3 - Pants & Jeans</option>
        <option value="4" data-category="1">4 - Skirts</option>
        <option value="5" data-category="1">5 - Jackets & Coats</option>
        <option value="6" data-category="2">6 - Shirts</option>
        <option value="7" data-category="2">7 - Pants & Jeans</option>
        <option value="8" data-category="2">8 - Shorts & Bermudas</option>
        <option value="9" data-category="2">9 - Sweatshirts & Hoodies</option>
        <option value="10" data-category="2">10 - Jackets & Coats</option>
        <option value="11" data-category="3">11 - Sneakers</option>
        <option value="12" data-category="3">12 - Boots</option>
        <option value="13" data-category="3">13 - Sandals & Heels</option>
        <option value="14" data-category="4">14 - Hats & Caps</option>
        <option value="15" data-category="4">15 - Bags & Backpacks</option>
        <option value="16" data-category="4">16 - Belts</option>
        <option value="17" data-category="4">17 - Scarves & Gloves</option>
        <option value="18" data-category="4">18 - Sunglasses</option>
      </select>
    </label>

    <label>Tallas y Stock:</label>
    <div id="sizesContainer">
      <label><input type="checkbox" name="size_checkbox" value="1" /> S <input type="number" name="stock_1" min="0" value="0" /></label>
      <label><input type="checkbox" name="size_checkbox" value="2" /> M <input type="number" name="stock_2" min="0" value="0" /></label>
      <label><input type="checkbox" name="size_checkbox" value="3" /> L <input type="number" name="stock_3" min="0" value="0" /></label>
      <label><input type="checkbox" name="size_checkbox" value="4" /> XL <input type="number" name="stock_4" min="0" value="0" /></label>
    </div>

    <label>Imagen:
      <input type="file" name="image" accept="image/*" required />
    </label>

    <button type="submit">Agregar</button>
  </form>

  <div id="resultado"></div>

  <h3>Productos existentes</h3>
  <table id="productosTable" border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Categoría</th>
        <th>Subcategoría</th>
        <th>Imagen</th>
        <th>Tallas</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Modal para editar producto -->
  <div id="editModal">
    <form id="editForm" enctype="multipart/form-data">
      <h3>Editar Producto</h3>
      <input type="hidden" name="id" id="editId" />
      <label>Nombre:
        <input type="text" name="name" id="editName" required />
      </label>
      <label>Precio:
        <input type="number" name="price" id="editPrice" step="0.01" required />
      </label>
      <label>Categoría:
        <select name="category_id" id="editCategory" required>
          <option value="" disabled selected>Selecciona una categoría</option>
          <option value="1">1 - Ropa de Mujer</option>
          <option value="2">2 - Ropa de Hombre</option>
          <option value="3">3 - Calzado</option>
          <option value="4">4 - Accesorios</option>
        </select>
      </label>
      <label>Subcategoría:
        <select name="subcategory_id" id="editSubcategory" required disabled>
          <option value="" disabled selected>Selecciona una subcategoría</option>
          <option value="1" data-category="1">1 - Blouses & Shirts</option>
          <option value="2" data-category="1">2 - Dresses</option>
          <option value="3" data-category="1">3 - Pants & Jeans</option>
          <option value="4" data-category="1">4 - Skirts</option>
          <option value="5" data-category="1">5 - Jackets & Coats</option>
          <option value="6" data-category="2">6 - Shirts</option>
          <option value="7" data-category="2">7 - Pants & Jeans</option>
          <option value="8" data-category="2">8 - Shorts & Bermudas</option>
          <option value="9" data-category="2">9 - Sweatshirts & Hoodies</option>
          <option value="10" data-category="2">10 - Jackets & Coats</option>
          <option value="11" data-category="3">11 - Sneakers</option>
          <option value="12" data-category="3">12 - Boots</option>
          <option value="13" data-category="3">13 - Sandals & Heels</option>
          <option value="14" data-category="4">14 - Hats & Caps</option>
          <option value="15" data-category="4">15 - Bags & Backpacks</option>
          <option value="16" data-category="4">16 - Belts</option>
          <option value="17" data-category="4">17 - Scarves & Gloves</option>
          <option value="18" data-category="4">18 - Sunglasses</option>
        </select>
      </label>

      <label>Tallas y Stock:</label>
      <div id="editSizesContainer">
        <label><input type="checkbox" name="size_checkbox" value="1" /> S <input type="number" name="stock_1" min="0" value="0" /></label>
        <label><input type="checkbox" name="size_checkbox" value="2" /> M <input type="number" name="stock_2" min="0" value="0" /></label>
        <label><input type="checkbox" name="size_checkbox" value="3" /> L <input type="number" name="stock_3" min="0" value="0" /></label>
        <label><input type="checkbox" name="size_checkbox" value="4" /> XL <input type="number" name="stock_4" min="0" value="0" /></label>
      </div>

      <label>Imagen:
        <input type="file" name="image" id="editImage" accept="image/*" />
      </label>

      <button type="submit">Actualizar</button>
      <button type="button" id="closeEdit">Cancelar</button>
    </form>
  </div>

  <script src="../js/add.js"></script>
</body>
</html>
