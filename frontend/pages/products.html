<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../pages/css/home.css">
</head>
<body>
  <div id="header-container"></div>
  <div id="navbar-container"></div>
  <div id="category-container"></div>
  <div class="productos" id="productos"></div>

  <!-- vista previa producto -->
<div id="productPreviewModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span id="closePreview" class="close">&times;</span>
    <img id="previewImage" src="" alt="" style="max-width:200px;">
    <h2 id="previewName"></h2>
    <p id="previewCategory"></p>
    <p id="previewSubcategory"></p>
    <p>Precio: $<span id="previewPrice"></span></p>

    <div id="sizesContainerPreview">
      <!-- Aquí se mostrarán las tallas disponibles con opción para seleccionar -->
    </div>

    <button id="addToCartFromPreview" disabled>Agregar al carrito</button>
  </div>
</div>

  <script>
function includeHTML(id, url) {
  return fetch(url)
    .then(response => response.text())
    .then(data => {
      document.getElementById(id).innerHTML = data;
    });
}

// Espera a que todos los includes terminen antes de inicializar el carrito
Promise.all([
  includeHTML('header-container', '../includes/header.html'),
  includeHTML('navbar-container', '../includes/navbar.html'),
  includeHTML('category-container', '../includes/category.html')
]).then(() => {
  // Aquí inicializas el carrito y otros scripts que dependan del HTML cargado
  if (typeof initCart === 'function') initCart();
  if (typeof initLogin === 'function') initLogin();
});
</script>
<script src="../js/cart.js"></script>
<script src="../js/login.js"></script>
<script src="../js/products.js"></script>
<script src="../js/order.js"></script>
</body>
</html>
