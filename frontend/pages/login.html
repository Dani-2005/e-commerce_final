<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login de Usuario</title>
  <link rel="stylesheet" href="./css/login.css">
  <style>
    .password-container {
      position: relative;
      width: 100%;
      max-width: 300px;
    }
    .password-container input[type="password"],
    .password-container input[type="text"] {
      width: 100%;
      padding-right: 40px;
      box-sizing: border-box;
    }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 18px;
      color: #666;
    }
    .toggle-password:hover {
      color: #000;
    }
    #result.error { color: #b00; margin-top: 10px; }
    #result.success { color: #080; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container-form">
    <h1>Login</h1>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Usuario" required><br>
      <div class="password-container">
        <input type="password" name="password" placeholder="Contraseña" required id="password" />
        <span class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">&#128065;</span>
      </div>
      <br />
      <button type="submit">Iniciar sesión</button>
      <p>¿Aún no te has registrado? <a href="register.html">Regístrate aquí</a></p>
    </form>
    <div id="result"></div>
  </div>
  <script src="/js/onlypublic.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        username: form.username.value,
        password: form.password.value
      };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        const resultDiv = document.getElementById('result');

        if (res.ok && result.token && result.user_id) {
          document.cookie = `jwt=${result.token}; path=/; max-age=3600`;
          sessionStorage.setItem('user_id', result.user_id);
          localStorage.setItem('user_id', result.user_id);
          console.log("User ID guardado:", result.user_id);

          // Redirección según el rol
          if (result.role && result.role.toLowerCase() === 'admin') {
            window.location.href = '/pages/indexadmin.html'; 
          } else if (result.redirect) {
            window.location.href = result.redirect;
          } else {
            window.location.href = '/pages/index.html'; 
          }
        } else {
          resultDiv.innerText = result.message || 'Usuario o contraseña incorrectos';
          resultDiv.className = 'error';
          resultDiv.style.display = 'block';
        }
      } catch (error) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerText = 'Error de conexión con el servidor';
        resultDiv.className = 'error';
        resultDiv.style.display = 'block';
        console.error(error);
      }
    });

    // Mostrar/ocultar contraseña con el icono ojo
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.title = type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña';
      this.style.color = type === 'password' ? '#666' : '#000';
    });
  </script>
</body>
</html>
