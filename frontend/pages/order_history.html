<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Órdenes</title>
  <link rel="stylesheet" href="./css/home.css">

</head>
<body>
  <div id="header-container"></div>
  <div id="navbar-container"></div>
  <div id="category-container"></div>
  <h2>Historial de Órdenes</h2>
  <table id="historyTable">
    <thead>
      <tr>
        <th>ID Orden</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Ver Detalle</th>
      </tr>
    </thead>
    <tbody>
      <!-- Órdenes aquí -->
    </tbody>
  </table>
  <div id="mensaje"></div>
  <button class="back">volver</button>
  <script type="module" src="/js/onlyuser.js"></script>


  <script>
    function includeHTML(id, url) {
      return fetch(url)
        .then(response => response.text())
        .then(data => {
          document.getElementById(id).innerHTML = data;
        });
    }

    Promise.all([
      includeHTML('header-container', '../includes/header.html'),
      includeHTML('navbar-container', '../includes/navbar.html'),
    ]).then(() => {
      if (typeof initCart === 'function') initCart();
      if (typeof initLogin === 'function') initLogin();
    });
  </script>
  <script src="../js/cart.js"></script>
  <script src="../js/order.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
