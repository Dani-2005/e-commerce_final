<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Órdenes</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    th, td { border: 1px solid #ddd; padding: 0.8rem; text-align: left; }
    th { background: #f2f2f2; }
    a { color: #1976d2; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Historial de Órdenes</h2>
  <table id="historyTable">
    <thead>
      <tr>
        <th>ID Orden</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Ver Detalle</th>
      </tr>
    </thead>
    <tbody>
      <!-- Órdenes aquí -->
    </tbody>
  </table>
  <div id="mensaje"></div>
  <button class="back">volver</button>
  <script type="module" src="/js/onlyuser.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const res = await fetch("http://localhost:3000/api/orders/", { credentials: "include" });
      const orders = await res.json();
      const tbody = document.querySelector("#historyTable tbody");
      if (!orders.length) {
        document.getElementById("mensaje").textContent = "No tienes órdenes previas.";
        return;
      }
      orders.forEach(order => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${order.id}</td>
          <td>${new Date(order.created_at).toLocaleString()}</td>
          <td>$${order.total.toFixed(2)}</td>
            <td>${order.status == "pendiente" ? "Pendiente" : "Completada"}</td> 
          <td><a href="order.html?orderId=${order.id}">Ver detalle</a></td>
        `;
        tbody.appendChild(tr);
      });
      document.querySelector(".back").addEventListener("click", () => {
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
