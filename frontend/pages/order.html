<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Orden</title>
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>
  <div id="header-container"></div>
  <div id="navbar-container"></div>
  <div id="category-container"></div>

<!-- Modal o sección oculta para seleccionar dirección -->
<div id="modal-direcciones" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); z-index:1000;">
  <div style="background:#fff; max-width:400px; margin:5% auto; padding:2rem; border-radius:8px;">
    <h3>Selecciona una dirección</h3>
    <div id="direcciones-list"></div>
    <button id="cerrar-modal">Cerrar</button>
  </div>
</div>


  <h2>Detalle de tu Orden</h2>
  <table id="orderTable">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Imagen</th>
        <th>Cantidad</th>
        <th>tallas</th>
        <th>Precio</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody>
      <!-- Productos de la orden aquí -->
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5" style="text-align:right;"><strong>Total:</strong></td>
        <td id="totalCell">$0.00</td>
      </tr>
    </tfoot>
  </table>
  <button id="pagar-btn">Pagar</button>
  <div id="mensaje"></div>
  <div id="facturaPreview" style="display:none; position:fixed; top:10%; left:10%; width:80%; height:80%; background:#fff; border:1px solid #ccc; overflow:auto; padding:20px; z-index:1000;">
  <button id="cerrarFactura">Cerrar</button>
  <h2>Factura de la Orden</h2>
  <div id="contenidoFactura"></div>
</div>

<script>
    function includeHTML(id, url) {
      return fetch(url)
        .then(response => response.text())
        .then(data => {
          document.getElementById(id).innerHTML = data;
        });
    }

    Promise.all([
      includeHTML('header-container', '../includes/header.html'),
      includeHTML('navbar-container', '../includes/navbar.html'),
    ]).then(() => {
      if (typeof initCart === 'function') initCart();
      if (typeof initLogin === 'function') initLogin();
    });
  </script>
  <script src="../js/order.js"></script>
  <script src="/js/onlyuser.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/cart.js"></script>
  <script>window.initOrderPage();</script>
</body>
</html>
