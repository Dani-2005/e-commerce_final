<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../pages/css/home.css">
    <link rel="stylesheet" href="../pages/css/preview.css">

</head>
<body>
  <div id="header-container"></div>
  <div id="navbar-container"></div>
  <div id="category-container"></div>
<div class="most-sold-wrapper">
  <button class="arrow left-arrow" id="mostSoldPrev">&#8592;</button>
  <div class="most-sold-content">
    <h2 class="most-sold-title">Productos más vendidos esta semana</h2>
    <div id="most-sold" class="most-sold-carousel"></div>
  </div>
  <button class="arrow right-arrow" id="mostSoldNext">&#8594;</button>
</div>



  <div id="discounted-products"></div>
  <div class="productos" id="productos"></div>


<script>
function includeHTML(id, url) {
  return fetch(url)
    .then(response => response.text())
    .then(data => {
      document.getElementById(id).innerHTML = data;
    });
}

// Espera a que todos los includes terminen antes de inicializar el carrito
Promise.all([
  includeHTML('header-container', '../includes/header.html'),
  includeHTML('navbar-container', '../includes/navbar.html'),
  includeHTML('category-container', '../includes/category.html')
]).then(() => {
  // Aquí inicializas el carrito y otros scripts que dependan del HTML cargado
  if (typeof initCart === 'function') initCart();
  if (typeof initLogin === 'function') initLogin();
  if (typeof initDiscount === 'function') initDiscount();
});
</script>

<script src="../js/cart.js"></script>
<script src="../js/login.js"></script>
<script src="../js/discount.js"></script>
<script src="../js/products.js"></script>

</body>
</html>
