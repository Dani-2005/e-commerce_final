<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ModaXpress - Ecommerce</title>
    <link rel="stylesheet" href="./css/home.css">
    </head>
    <body>
    <header>
        <div class="logo-container">
            <img class="logo" src="/uploads/logo modaxpress.jpeg" alt="Logo de la tienda">
        <h1 id="titulo-tienda">ModaXpress</h1>
        <div id="user-actions">
            <button id="login-btn" style="display: none;">Iniciar Sesión</button>
            <button id="register-btn" style="display: none;">Registrarse</button>
            <button id="logout-btn" style="display: none;">Cerrar Sesión</button>
        </div>
        </div>
        <div class="slogan">
            <p>Bienvenido a nuestra tienda de moda. ¡Encuentra tu estilo perfecto!</p>
      
        <button id="open-cart" class="cart-btn">        
        🛒 Carrito
        </button>
        <div class="cart cart-float" id="cart-float">
        <button id="close-cart" class="close-cart">&times;</button>
        <h2>Carrito de compras</h2>
        <div></div>
        <div class="cart-total">
            Total: <span></span>
        </div>
        <button id="checkout-btn">Finalizar compra</button>
        </div>



    </header>

    <div class="productos" id="productos"></div>
    
    <script>
        fetch('http://localhost:3000/api/products')
        .then(res => res.json())
        .then(data => {
            const contenedor = document.getElementById('productos');
            data.forEach(producto => {
            const card = document.createElement('div');
            card.className = 'producto';
            card.innerHTML = `
                <img src="/uploads/${producto.image}" alt="${producto.name}">
                <h2>${producto.name}</h2>
                <p>${producto.category_name}</p>
                <div class="precio">$${producto.price}</div>
                <button class="add-cart" data-id="${producto.product_id}">Agregar al carrito</button>
            `;
            contenedor.appendChild(card);
            });
        })
        .catch(error => console.error('Error al obtener los productos:', error));

        document.addEventListener("DOMContentLoaded", async () => {
        const loginBtn = document.getElementById("login-btn");
        const registerBtn = document.getElementById("register-btn");
        const logoutBtn = document.getElementById("logout-btn");

        // Verificar sesión con cookies (JWT)
        const cookies = document.cookie.split("; ");
        const jwtCookie = cookies.find(row => row.startsWith("jwt="));

        if (jwtCookie) {
            logoutBtn.style.display = "block"; // Si hay token, mostrar botón de cerrar sesión
        } else {
            loginBtn.style.display = "block"; 
            registerBtn.style.display = "block";
        }

        // Agregar evento de clic para el botón de iniciar sesión
        loginBtn.addEventListener("click", () => {
            window.location.href = "login.html"; // Redirigir a la página de inicio de sesión
        });

        // Agregar evento de clic para el botón de registrarse
        registerBtn.addEventListener("click", () => {
            window.location.href = "register.html"; // Redirigir a la página de registro
        });

        // Agregar evento de clic para el botón de cerrar sesión

        logoutBtn.addEventListener("click", () => {
            document.cookie = "jwt=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            location.reload(); // Recargar para actualizar la interfaz
        });
    });

    </script>
    <script
    src = "../js/cart.js">
    </script>
    </body>
    </html>
