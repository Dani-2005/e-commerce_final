<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agregar Producto</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    form { max-width: 400px; margin: auto; background: #f8f8f8; padding: 2rem; border-radius: 8px; }
    label { display: block; margin-top: 1rem; }
    input, select { width: 100%; padding: 0.5rem; margin-top: 0.3rem; }
    button { margin-top: 1.5rem; padding: 0.7rem 1.5rem; background: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #resultado { max-width: 400px; margin: 1rem auto; font-weight: bold; }
    /* Estilos para la tabla */
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.8rem; text-align: left; }
    th { background: #f2f2f2; }
    /* Estilos para el modal */
    #editModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; }
    #editForm { background: #fff; padding: 2rem; border-radius: 8px; max-width: 400px; margin: auto; }
  </style>
</head>
<body>
  <h2>Agregar Producto</h2>

  <form id="productForm" enctype="multipart/form-data">
    <label>Nombre:
      <input type="text" name="name" required />
    </label>
    <label>Precio:
      <input type="number" name="price" step="0.01" required />
    </label>
    <label>Stock:
      <input type="number" name="stock" required />
    </label>
    <label>Categoría:
      <select name="category_id" id="category" required>
        <option value="" disabled selected>Selecciona una categoría</option>
        <option value="1">1 - Ropa de Mujer</option>
        <option value="2">2 - Ropa de Hombre</option>
        <option value="3">3 - Calzado</option>
        <option value="4">4 - Accesorios</option>
      </select>
    </label>
    <label>Subcategoría:
      <select name="subcategory_id" id="subcategory" required disabled>
        <option value="" disabled selected>Selecciona una subcategoría</option>
        <option value="1" data-category="1">1 - Blouses & Shirts</option>
        <option value="2" data-category="1">2 - Dresses </option>
        <option value="3" data-category="1">3 - Pants & Jeans </option>
        <option value="4" data-category="1">4 - Skirts </option>
        <option value="5" data-category="1">5 - Jackets & Coats </option>
        <option value="6" data-category="2">6 - Shirts </option>
        <option value="7" data-category="2">7 - Pants & Jeans </option>
        <option value="8" data-category="2">8 - Shorts & Bermudas </option>
        <option value="9" data-category="2">9 - Sweatshirts & Hoodies </option>
        <option value="10" data-category="2">10 - Jackets & Coats </option>
        <option value="11" data-category="3">11 - Sneakers </option>
        <option value="12" data-category="3">12 - Boots </option>
        <option value="13" data-category="3">13 - Sandals & Heels </option>
        <option value="14" data-category="4">14 - Hats & Caps </option>
        <option value="15" data-category="4">15 - Bags & Backpacks </option>
        <option value="16" data-category="4">16 - Belts </option>
        <option value="17" data-category="4">17 - Scarves & Gloves </option>
        <option value="18" data-category="4">18 - Sunglasses </option>
      </select>
    </label>
    <label>Imagen:
      <input type="file" name="image" accept="image/*" required />
    </label>
    <button type="submit">Agregar</button>
  </form>

  <div id="resultado"></div>

  <!-- Tabla de productos -->
  <h3>Productos existentes</h3>
  <table id="productosTable" border="1" style="width:100%;margin-top:1rem;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Categoría</th>
        <th>Subcategoría</th>
        <th>Imagen</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  
  <div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);align-items:center;justify-content:center;">
    <form id="editForm" enctype="multipart/form-data" style="background:#fff;padding:2rem;border-radius:8px;max-width:400px;margin:auto;">
      <h3>Editar Producto</h3>
      <input type="hidden" name="id" id="editId" />
      <label>Nombre:
        <input type="text" name="name" id="editName" required />
      </label>
      <label>Precio:
        <input type="number" name="price" id="editPrice" step="0.01" required />
      </label>
      <label>Stock:
        <input type="number" name="stock" id="editStock" required />
      </label>
      <label>Categoría:
        <select name="category_id" id="editCategory" required>
          <option value="1">1 - Ropa de Mujer</option>
          <option value="2">2 - Ropa de Hombre</option>
          <option value="3">3 - Calzado</option>
          <option value="4">4 - Accesorios</option>
        </select>
      </label>
      <label>Subcategoría:
        <select name="subcategory_id" id="editSubcategory" required>
          <option value="1" data-category="1">1 - Blouses & Shirts</option>
          <option value="2" data-category="1">2 - Dresses </option>
          <option value="3" data-category="1">3 - Pants & Jeans </option>
          <option value="4" data-category="1">4 - Skirts </option>
          <option value="5" data-category="1">5 - Jackets & Coats </option>
          <option value="6" data-category="2">6 - Shirts </option>
          <option value="7" data-category="2">7 - Pants & Jeans </option>
          <option value="8" data-category="2">8 - Shorts & Bermudas </option>
          <option value="9" data-category="2">9 - Sweatshirts & Hoodies </option>
          <option value="10" data-category="2">10 - Jackets & Coats </option>
          <option value="11" data-category="3">11 - Sneakers </option>
          <option value="12" data-category="3">12 - Boots </option>
          <option value="13" data-category="3">13 - Sandals & Heels </option>
          <option value="14" data-category="4">14 - Hats & Caps </option>
          <option value="15" data-category="4">15 - Bags & Backpacks </option>
          <option value="16" data-category="4">16 - Belts </option>
          <option value="17" data-category="4">17 - Scarves & Gloves </option>
          <option value="18" data-category="4">18 - Sunglasses </option>
        </select>
      </label>
      <label>Imagen:
        <input type="file" name="image" id="editImage" accept="image/*" />
      </label>
      <button type="submit">Actualizar</button>
      <button type="button" id="closeEdit">Cancelar</button>
    </form>
  </div>

  <script>
    const categoriaSelect = document.getElementById('category');
    const subcategoriaSelect = document.getElementById('subcategory');
    const todasSubcategorias = Array.from(subcategoriaSelect.querySelectorAll('option'));

    categoriaSelect.addEventListener('change', () => {
      const categoriaSeleccionada = categoriaSelect.value;

      // Limpiar subcategorías y agregar opción por defecto
      subcategoriaSelect.innerHTML = '<option value="" disabled selected>Selecciona una subcategoría</option>';

      // Filtrar opciones que coinciden con la categoría seleccionada
      const subcategoriasFiltradas = todasSubcategorias.filter(option => option.dataset.category === categoriaSeleccionada);

      // Añadir las subcategorías filtradas
      subcategoriasFiltradas.forEach(option => {
        subcategoriaSelect.appendChild(option);
      });

      // Habilitar select de subcategorías
      subcategoriaSelect.disabled = false;
    });

    // Manejo del envío del formulario de agregar producto
    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      console.log('¡El submit funciona!');
      const formData = new FormData(this);

      try {
        const res = await fetch('http://localhost:3000/api/products', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        document.getElementById('resultado').textContent =
          res.ok ? 'Producto agregado correctamente' : 'Error: ' + data.error;

        if (res.ok) {
          this.reset();
          cargarProductos();
        }
      } catch (err) {
        document.getElementById('resultado').textContent = 'Error de conexión';
      }
    });

    // Cargar productos al iniciar
    document.addEventListener('DOMContentLoaded', fetchProductos);

    async function fetchProductos() {
      const res = await fetch('http://localhost:3000/api/products');
      const productos = await res.json();
      renderProductos(productos);
    }

    function renderProductos(productos) {
      const tbody = document.querySelector('#productosTable tbody');
      tbody.innerHTML = '';
      productos.forEach(prod => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${prod.product_id}</td>
          <td>${prod.name}</td>
          <td>${prod.price}</td>
          <td>${prod.stock}</td>
          <td>${prod.category_id}</td>
          <td>${prod.subcategory_id}</td>
          <td><img src="${prod.image}" width="40"/></td>
          <td>
            <button onclick="borrarProducto(${prod.product_id})">Borrar</button>
            <button onclick="abrirEditar(${prod.product_id},'${prod.name}',${prod.price},${prod.stock})">Editar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Borrar producto
    async function borrarProducto(id) {
      if (!confirm('¿Seguro que deseas borrar este producto?')) return;
      const res = await fetch(`http://localhost:3000/api/products/${id}`, { method: 'DELETE' });
      if (res.ok) {
        fetchProductos();
        document.getElementById('resultado').textContent = 'Producto borrado';
      } else {
        document.getElementById('resultado').textContent = 'Error al borrar';
      }
    }

    // Abrir modal de edición
    window.abrirEditar = function(id, name, price, stock) {
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = name;
      document.getElementById('editPrice').value = price;
      document.getElementById('editStock').value = stock;
      document.getElementById('editModal').style.display = 'flex';
    };

    document.getElementById('closeEdit').onclick = function() {
      document.getElementById('editModal').style.display = 'none';
    };

    // Actualizar producto
    document.getElementById('editForm').onsubmit = async function(e) {
  e.preventDefault();
  console.log('¡El submit funciona!');
  const id = document.getElementById('editId').value;
  const formData = new FormData(this); // <-- ESTA LÍNEA ES LA CLAVE

  // Mostrar todos los valores del FormData en la consola
  for (let pair of formData.entries()) {
    console.log(pair[0]+ ': ' + pair[1]);
  }

  const res = await fetch(`http://localhost:3000/api/products/${id}`, {
    method: 'PUT',
    body: formData
  });
  let data;
  try {
    data = await res.json();
  } catch (error) {
    console.error('Error al parsear la respuesta:', error);
  }
  if (res.ok) {
    document.getElementById('editModal').style.display = 'none';
    fetchProductos();
    document.getElementById('resultado').textContent = 'Producto actualizado';
  } else {
    document.getElementById('resultado').textContent = 'Error al actualizar';
    (data && data.error) ? document.getElementById('resultado').textContent += ': ' + data.error : '';
  }
};

  </script>
</body>
</html>
